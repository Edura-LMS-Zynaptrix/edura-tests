name: Tests CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  smoke-test:
    name: Critical Path Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Syntax & Lint Check
        run: |
          python -m py_compile smoke/critical_path.py integration/test_payment_enrollment_flow.py

  integration-test:
    name: Payment & Enrollment Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'develop' || github.base_ref == 'main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Integration Tests
        # No staging is reachable here, so the suite runs against its in-process
        # mock transport. These are throwaway values, not real credentials.
        env:
          SECRET_KEY: ci-mock-jwt-key-not-a-real-secret
          PAYHERE_MERCHANT_ID: ci_mock_merchant
          PAYHERE_MERCHANT_SECRET: ci-mock-merchant-secret
        run: |
          pytest integration/test_payment_enrollment_flow.py -v
