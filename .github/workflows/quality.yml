name: Tests Quality (Lint & Security)

# Development guideline 7.2: lint runs on every push to any branch;
# the security scan runs on pushes to develop/main and on pull requests.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [ develop, main ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install ruff black

      - name: Python lint (Ruff)
        run: ruff check .

      - name: Python format check (Black)
        run: black --check .

  security:
    name: Security Scan
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies (accepted advisories excluded)
        run: bash scripts/security-scan.sh
